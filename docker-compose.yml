services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: tickethub
      MYSQL_USER: tickethub
      MYSQL_PASSWORD: tickethub
    command: ["--innodb-lock-wait-timeout=5", "--transaction-isolation=READ-COMMITTED"]
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/tickethub?useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&serverTimezone=UTC"
      DB_USER: tickethub
      DB_PASSWORD: tickethub
      JWT_SECRET: local-dev-secret-key-must-be-at-least-32-bytes-long!!
      PAYMENT_WEBHOOK_SECRET: test-webhook-secret
      CORS_ORIGINS: http://localhost:5173
    ports: ["8080:8080"]

volumes:
  mysql_data:
